---
# Render Blueprint — Insumos S.R.L. (Propuesta v2)
# Deploy manual alternativo: Render → New → Static Site → conectar repo.
# Build command: (vacío) · Publish directory: .
services:
  - type: web
    name: insumos-srl
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public,max-age=31536000,immutable
    envVars:
      - key: WHATSAPP_NUMBER
        value: 595986809607
